name: Release Guardlens Core

on:
  pull_request:
    paths:
      - "src/ide_scanner/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/release-core.yml"
  push:
    tags:
      - "guardlens-core-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the canonical engine
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install .
      - name: Run scanner contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build distribution wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("guardlens_core-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "ide_scanner/__init__.py",
              "ide_scanner/scanner.py",
              "ide_scanner/provider_rules/semgrep/vscode-security.yml",
              "ide_scanner/provider_rules/yara/ide-scanner.yar",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing canonical engine files: {missing}")
          PY
      - name: Upload canonical wheel
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: guardlens-core-wheel
          path: dist/guardlens_core-*.whl
