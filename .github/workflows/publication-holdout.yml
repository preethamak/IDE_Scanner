name: Publication accuracy holdout

# This workflow is intentionally separate from the deterministic regression
# gate. It must prove performance on exact, independently labelled ecosystem
# artifacts before a website release can be activated. It never publishes a
# registry release by itself.
on:
  workflow_run:
    workflows: ["Scanner production gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GUARDRAILS_RUNTIME_EXTERNAL_TRACE: "1"
      GUARDRAILS_RUNTIME_BWRAP_SUDO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime isolation backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap strace
          bwrap --version
          strace --version
      - name: Verify runtime namespace isolation
        run: |
          sudo -n bwrap \
            --die-with-parent \
            --new-session \
            --unshare-net \
            --unshare-pid \
            --unshare-uts \
            --unshare-ipc \
            --unshare-user \
            --uid 65534 \
            --gid 65534 \
            --cap-drop ALL \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /sbin /sbin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /etc /etc \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --clearenv \
            --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --chdir / \
            -- /usr/bin/true
      - name: Install scanner and analyzers
        run: python -m pip install -e '.[analysis]'
      - name: Provision verified runtime sidecars
        run: python scripts/provision_runtime_dependencies.py --cache "$RUNNER_TEMP/guardrails-runtime-cache"
      - name: Verify scanner runtime preflight
        run: python -m ide_scanner.cli sandbox-preflight --out runtime-preflight.json
      - name: Verify labelled holdout provenance
        run: |
          python scripts/verify_holdout_provenance.py \
            --source benchmarks/holdouts/real-evidence-2026-source.json \
            --advisories src/ide_scanner/intelligence/extension-advisories.json
      - name: Freeze exact external holdout
        run: |
          python scripts/freeze_accuracy_holdout.py \
            --source benchmarks/holdouts/real-evidence-2026-source.json \
            --output-dir holdout-artifacts \
            --corpus holdout-corpus.json \
            --manifest holdout-manifest.json
      - name: Scan deterministic regression corpus
        env:
          IDE_SCANNER_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python -m ide_scanner scan \
            --fixtures \
            --threat-feed benchmarks/threat-feed.json \
            --format json \
            --out regression-fixtures.json
          python -m ide_scanner benchmark production \
            --corpus benchmarks/production-corpus.json \
            --report regression-fixtures.json \
            --fail-on-regression \
            --require-identity \
            --expected-scanner-build "$IDE_SCANNER_BUILD_SHA" \
            --out regression-gate.json
      - name: Scan exact holdout with required runtime coverage
        env:
          IDE_SCANNER_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GUARDRAILS_RUNTIME_CACHE: ${{ runner.temp }}/guardrails-runtime-cache
        run: |
          # Keep the accuracy gate serialized: exact third-party artifacts can
          # invoke semgrep and the runtime backend, and parallel workers can
          # turn a healthy artifact into a timeout through host contention.
          python scripts/scan_corpus.py \
            --manifest holdout-manifest.json \
            --profile deep \
            --runtime \
            --runtime-timeout 20 \
            --jobs 1 \
            --timeout 180 \
            --out holdout-scan.json
          python -m ide_scanner benchmark holdout \
            --corpus holdout-corpus.json \
            --report holdout-scan.json \
            --fail-on-regression \
            --require-identity \
            --expected-scanner-build "$IDE_SCANNER_BUILD_SHA" \
            --out holdout-gate.json
      - name: Create empty advisory snapshot for behavior-only shadow replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          Path("empty-extension-advisories.json").write_text(
              json.dumps({"snapshot_version": "publication-behavior-only-empty.1", "entries": []}) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Scan behavior-only shadow holdout
        env:
          IDE_SCANNER_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GUARDRAILS_RUNTIME_CACHE: ${{ runner.temp }}/guardrails-runtime-cache
        run: |
          python scripts/scan_corpus.py \
            --manifest holdout-manifest.json \
            --profile deep \
            --runtime \
            --runtime-timeout 20 \
            --jobs 1 \
            --timeout 180 \
            --extension-advisories empty-extension-advisories.json \
            --out behavior-holdout-scan.json
          python -m ide_scanner benchmark holdout \
            --corpus holdout-corpus.json \
            --report behavior-holdout-scan.json \
            --behavior-only \
            --fail-on-regression \
            --require-identity \
            --expected-scanner-build "$IDE_SCANNER_BUILD_SHA" \
            --out behavior-holdout-gate.json
      - name: Audit holdout rule-level evidence
        run: |
          python scripts/audit_report.py \
            --report holdout-scan.json \
            --labels holdout-corpus.json \
            --out holdout-rule-audit.json
      - name: Build publication accuracy gate
        run: |
          python scripts/build_publication_accuracy_gate.py \
            --regression-gate regression-gate.json \
            --holdout-gate holdout-gate.json \
            --behavior-gate behavior-holdout-gate.json \
            --holdout-corpus holdout-corpus.json \
            --rule-audit holdout-rule-audit.json \
            --out publication-accuracy-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-publication-accuracy-gate
          path: |
            regression-fixtures.json
            regression-gate.json
            holdout-corpus.json
            holdout-manifest.json
            runtime-preflight.json
            holdout-scan.json
            holdout-gate.json
            behavior-holdout-scan.json
            behavior-holdout-gate.json
            holdout-rule-audit.json
            publication-accuracy-gate.json
          retention-days: 30
          if-no-files-found: warn
