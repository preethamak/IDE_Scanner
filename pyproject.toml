[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardlens-core"
version = "0.2.3"
description = "Proprietary scanner runtime for Guardrails CLI."
requires-python = ">=3.11"
readme = "PYPI_README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Preetham AK" }]
maintainers = [{ name = "Preetham AK" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "tldextract>=5,<6",
  "tiktoken>=0.7,<1",
  "gitingest>=0.1,<1",
  "google-genai>=1,<2",
  "langfuse>=2,<4",
  "loguru>=0.7,<1",
  "mcp>=1,<2",
  "packageurl-python>=0.16,<1",
  "json5>=0.9,<1",
  "pyyaml>=6,<7",
  "packaging>=24,<27",
]

[project.optional-dependencies]
semgrep = ["semgrep==1.164.0"]
yara = ["yara-python==4.5.4"]
analysis = ["semgrep==1.164.0", "yara-python==4.5.4"]

[project.urls]
Website = "https://abscissa.dev"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ide_scanner*"]

[tool.setuptools.package-data]
ide_scanner = [
  "calibration/*.json",
  "contracts/*.json",
  "intelligence/*.json",
  "js_ast/*.js",
  "js_ast/*LICENSE*",
  "provider_rules/semgrep/*.yml",
  "provider_rules/yara/*.yar",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
